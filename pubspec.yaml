name: ai_task_manager
description: "Google Tasks-inspired, AI-powered task manager with a pluggable AI gateway and a C++ FFI priority core."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  ffi: ^2.1.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^18.0.0

flutter:
  uses-material-design: true
